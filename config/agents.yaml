# Configuration des agents LLM.
# Changer le modèle d'un agent = modifier `model` ici, puis rejouer l'évaluation. Aucun code à toucher.
#
# temperature : null = valeur par défaut du modèle. Les modèles Claude actuels (Sonnet 5.5, Haiku 5.5)
# refusent les valeurs non par défaut : ne la renseigner que pour un fournisseur qui l'accepte.
# allowed_tools : liste blanche des outils de l'agent (vide ou absente = aucun outil). Tout outil absent
# de la liste est refusé, y compris pour `veille`. Seconde couche : un outil web n'est accepté que pour `veille`,
# quelle que soit cette liste (règle codée dans llm/guards.py).
# effort : low | medium | high | xhigh | max (null = défaut du modèle : medium sur Haiku 5.5, high sur Sonnet 5.5).
#   Valeur la plus basse au départ, à relever seulement si l'évaluation le justifie. La réflexion (thinking)
#   reste active par défaut et consomme max_tokens : surveiller les réponses `incomplete` (stop_reason max_tokens).
# web_search_max_uses : nombre maximal de recherches web par appel (obligatoire si un outil web est autorisé : web_search, web_fetch...).
#   Il est imposé à l'outil par l'adaptateur et compté dans la réservation (pire cas).

agents:
  sourcing:
    provider: anthropic
    model: claude-haiku-5-5
    mode: sync
    max_tokens: 2048
    temperature: null
    effort: low
    allowed_tools: []
  sav:
    provider: anthropic
    model: claude-haiku-5-5
    mode: sync
    max_tokens: 1024
    temperature: null
    effort: low
    allowed_tools: []
  veille:
    provider: anthropic
    model: claude-sonnet-5-5
    mode: batch
    max_tokens: 8192
    temperature: null
    effort: low
    allowed_tools: [web_search]
    web_search_max_uses: 5
  boutique:
    provider: anthropic
    model: claude-sonnet-5-5
    mode: batch
    max_tokens: 4096
    temperature: null
    effort: low
    allowed_tools: []
  marketing:
    provider: anthropic
    model: claude-sonnet-5-5
    mode: sync
    max_tokens: 2048
    temperature: null
    effort: low
    allowed_tools: []
  contenu:
    provider: anthropic
    model: claude-sonnet-5-5
    mode: batch
    max_tokens: 4096
    temperature: null
    effort: low
    allowed_tools: []

# Plafonds mensuels en USD. Alerte à alert_ratio, refus à 100 %.
budgets:
  alert_ratio: 0.8
  prod:
    global_monthly: 60
    per_shop_monthly: 45
    shop_overrides: {}   # ex. { shop-bougies: 20 }
  eval:
    global_monthly: 5    # appels du runner d'évaluation, hors plafonds de production

estimation:
  chars_per_token: 3.5
  input_margin: 0.20     # +20 % sur l'entrée estimée
  search_tokens_estimate: 4000   # tokens d'entrée par recherche web (résultats relus), à calibrer sur le journal

batch:
  stale_after_hours: 24

# Une réservation `pending` (appel synchrone) plus vieille que ce délai est considérée comme abandonnée
# (processus tué avant d'écrire le résultat) : elle est libérée à la prochaine réservation, avec alerte.
reservations:
  pending_ttl_minutes: 15

# Options par fournisseur. timeout_s : délai maximal d'une tentative (le SDK ne fait aucune reprise :
# max_retries=0, les reprises sont gérées et journalisées par l'adaptateur). Doit rester < pending_ttl_minutes.
providers:
  anthropic:
    timeout_s: 120

retry:
  max_retries: 2
  base_delay_s: 2        # délais : 2 s puis 4 s
